<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>连连看 - 经典消除游戏</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' style='stop-color:%23f7971e'/><stop offset='100%25' style='stop-color:%23ffd200'/></linearGradient><linearGradient id='b' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' style='stop-color:%234fc3f7'/><stop offset='100%25' style='stop-color:%23a8edea'/></linearGradient></defs><rect x='4' y='20' width='24' height='24' rx='6' fill='url(%23g)' stroke='%23fff' stroke-width='1.5'/><rect x='36' y='20' width='24' height='24' rx='6' fill='url(%23b)' stroke='%23fff' stroke-width='1.5'/><line x1='26' y1='32' x2='38' y2='32' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-dasharray='4,3'/><circle cx='16' cy='32' r='2.5' fill='%23fff'/><circle cx='48' cy='32' r='2.5' fill='%23fff'/></svg>" type="image/svg+xml">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0c29; --bg2: #302b63; --bg3: #24243e;
    --card-bg: rgba(255,255,255,0.08); --card-border: rgba(255,255,255,0.15);
    --accent: #f7971e; --accent2: #ffd200;
    --blue: #4fc3f7; --green: #a8edea; --red: #ff6b6b;
    --text: #f0f0f0; --text-dim: rgba(255,255,255,0.5);
    --shadow: 0 8px 32px rgba(0,0,0,0.4); --radius: 12px;
  }

  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 50%, var(--bg3) 100%);
    min-height: 100vh; color: var(--text); overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  #particles-canvas {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0; opacity: 0.4;
  }

  #app {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 8px; min-height: 100vh;
  }

  .game-title {
    font-size: clamp(1.4rem, 4vw, 2.4rem);
    font-weight: 900; letter-spacing: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent2), var(--blue));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin-bottom: 4px;
    filter: drop-shadow(0 0 20px rgba(247,151,30,0.5));
    animation: titlePulse 3s ease-in-out infinite;
  }

  @keyframes titlePulse {
    0%, 100% { filter: drop-shadow(0 0 20px rgba(247,151,30,0.5)); }
    50% { filter: drop-shadow(0 0 35px rgba(247,151,30,0.9)); }
  }

  .screen { display: none; width: 100%; max-width: 1000px; }
  .screen.active { display: flex; flex-direction: column; align-items: center; }

  /* ===== 开始屏幕 ===== */
  #screen-start { gap: 12px; }
  .start-subtitle { color: var(--text-dim); font-size: 0.85rem; letter-spacing: 2px; }

  .level-map-wrap {
    width: 100%; max-width: 680px; position: relative;
    overflow-x: hidden;
  }

  .chapter-block { margin-bottom: 16px; }
  .chapter-title {
    font-size: 0.8rem; font-weight: 700; color: var(--blue);
    letter-spacing: 2px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .chapter-title::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, rgba(79,195,247,0.3), transparent);
  }

  /* 地图式关卡节点 */
  .map-row {
    display: flex; align-items: center; justify-content: center;
    gap: 6px; flex-wrap: wrap; padding: 4px 0;
  }

  .map-node {
    width: 48px; height: 48px; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.25s; position: relative;
    border: 2px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(6px);
    text-decoration: none; color: var(--text);
  }
  .map-node:hover {
    transform: scale(1.15); border-color: var(--accent);
    box-shadow: 0 0 20px rgba(247,151,30,0.4);
    z-index: 2;
  }
  .map-node .node-icon { font-size: 1rem; line-height: 1; }
  .map-node .node-num {
    font-size: 0.5rem; font-weight: 700; color: var(--text-dim);
    position: absolute; bottom: 2px;
  }

  /* 已通关 */
  .map-node.cleared {
    background: linear-gradient(135deg, rgba(67,160,71,0.35), rgba(102,187,106,0.2));
    border-color: rgba(102,187,106,0.5);
  }
  .map-node.cleared .node-num { color: #a5d6a7; }

  /* 三星通关 */
  .map-node.cleared3 {
    background: linear-gradient(135deg, rgba(255,214,0,0.3), rgba(247,151,30,0.2));
    border-color: rgba(255,214,0,0.6);
    box-shadow: 0 0 10px rgba(255,214,0,0.2);
  }
  .map-node.cleared3 .node-num { color: var(--accent2); }

  /* 特殊关卡标记 */
  .map-node .node-badge {
    position: absolute; top: -4px; right: -4px;
    background: var(--accent); color: #000; font-size: 0.4rem;
    font-weight: 700; padding: 1px 4px; border-radius: 99px;
    white-space: nowrap;
  }

  /* 星星行 */
  .node-stars {
    font-size: 0.45rem; letter-spacing: 0; color: var(--accent2);
    position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
    white-space: nowrap;
  }

  /* 连接路径 */
  .map-path {
    width: 16px; height: 2px; background: rgba(255,255,255,0.1);
    flex-shrink: 0;
  }
  .map-path.cleared-path { background: rgba(102,187,106,0.4); }

  /* ===== 游戏屏幕 ===== */
  #screen-game { gap: 8px; width: 100%; }

  .hud {
    display: flex; gap: 8px; align-items: center;
    width: 100%; max-width: 900px; flex-wrap: wrap; justify-content: center;
  }
  .hud-item {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: var(--radius); padding: 6px 14px;
    display: flex; flex-direction: column; align-items: center;
    backdrop-filter: blur(10px); min-width: 70px;
  }
  .hud-label { font-size: 0.55rem; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; }
  .hud-value { font-size: 1.1rem; font-weight: 700; color: var(--accent2); transition: transform 0.15s; }
  .hud-value.score-pop { transform: scale(1.3); }
  .level-badge-hud {
    background: linear-gradient(90deg, rgba(247,151,30,0.15), rgba(255,210,0,0.15));
    border: 1px solid rgba(247,151,30,0.3); border-radius: var(--radius);
    padding: 6px 14px; display: flex; flex-direction: column; align-items: center;
    backdrop-filter: blur(10px);
  }
  .level-badge-hud .hud-label { color: var(--accent); }
  .level-badge-hud .hud-value { font-size: 0.9rem; color: var(--accent2); }

  /* 时间进度条 */
  .time-bar-wrap {
    width: 100%; max-width: 900px;
    background: rgba(255,255,255,0.06); border-radius: 99px; height: 14px; overflow: hidden;
    position: relative; border: 1px solid rgba(255,255,255,0.08);
  }
  .time-bar {
    height: 100%; border-radius: 99px;
    transition: width 1s linear, background 0.5s;
    position: relative;
  }
  .time-bar.safe { background: linear-gradient(90deg, #43a047, #66bb6a); }
  .time-bar.warn { background: linear-gradient(90deg, #f57c00, #ffb74d); }
  .time-bar.danger { background: linear-gradient(90deg, #c62828, #ef5350); animation: barPulse 0.6s ease-in-out infinite; }
  .time-bar.penalty { animation: barPenalty 0.5s ease-out; }
  .time-bar.bonus { animation: barBonus 0.6s ease-out; }
  @keyframes barPulse { 0%,100%{opacity:1}50%{opacity:0.6} }
  @keyframes barPenalty { 0%{filter:brightness(0.3)}30%{filter:brightness(2.5)}100%{filter:brightness(1)} }
  @keyframes barBonus { 0%{filter:brightness(1.6) hue-rotate(20deg)}50%{filter:brightness(2.2) hue-rotate(40deg)}100%{filter:brightness(1)} }
  .time-bar-text {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 0.55rem; font-weight: 700; color: rgba(255,255,255,0.9);
    text-shadow: 0 1px 3px rgba(0,0,0,0.5); letter-spacing: 1px; white-space: nowrap;
  }
  .time-bar-shine {
    position: absolute; top: 0; left: 0; right: 0; height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.25), transparent);
    border-radius: 99px 99px 0 0;
  }

  /* 消除进度条 */
  .progress-wrap {
    width: 100%; max-width: 900px;
    background: rgba(255,255,255,0.06); border-radius: 99px; height: 5px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .progress-bar {
    height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px; transition: width 0.4s ease;
    box-shadow: 0 0 8px rgba(247,151,30,0.4);
  }

  /* ===== 棋盘 ===== */
  #board-wrap {
    background: rgba(0,0,0,0.35); border: 1px solid var(--card-border);
    border-radius: 16px; padding: 10px;
    backdrop-filter: blur(16px);
    box-shadow: var(--shadow), 0 0 60px rgba(79,195,247,0.08);
    overflow: hidden; max-width: 100%; position: relative;
  }

  #board { display: grid; gap: 3px; position: relative; }

  .cell {
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform 0.12s, box-shadow 0.12s, background 0.15s, border-color 0.15s;
    background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
    border: 2px solid rgba(255,255,255,0.1);
    position: relative; user-select: none; line-height: 1;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.1);
  }

  .cell img.tile-icon {
    width: 70%; height: 70%; object-fit: contain;
    pointer-events: none; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
    transition: transform 0.12s;
  }

  .cell:not(.empty):not(.matched):hover {
    transform: scale(1.06);
    background: linear-gradient(145deg, rgba(255,255,255,0.2), rgba(255,255,255,0.08));
    border-color: rgba(255,255,255,0.35);
    z-index: 2;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.15);
  }

  .cell.selected {
    background: linear-gradient(145deg, rgba(79,195,247,0.35), rgba(79,195,247,0.15)) !important;
    border-color: var(--blue) !important;
    box-shadow: 0 0 20px rgba(79,195,247,0.5), inset 0 1px 0 rgba(255,255,255,0.2) !important;
    transform: scale(1.06);
    z-index: 3;
  }
  .cell.selected img.tile-icon { transform: scale(1.1); }

  .cell.hint { animation: hintPulse 0.6s ease-in-out infinite alternate; }
  @keyframes hintPulse {
    from { box-shadow: 0 0 8px rgba(168,237,234,0.4); border-color: var(--green); }
    to { box-shadow: 0 0 24px rgba(168,237,234,0.9); border-color: #fff; transform: scale(1.08); }
  }

  .cell.wrong { animation: shake 0.4s ease; background: rgba(255,107,107,0.3); border-color: var(--red); }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-5px); }
    40% { transform: translateX(5px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .cell.matched { animation: matchBurst 0.45s ease forwards; pointer-events: none; }
  @keyframes matchBurst {
    0% { transform: scale(1.1); opacity: 1; }
    40% { transform: scale(1.3); opacity: 0.8; filter: brightness(2.5); }
    100% { transform: scale(0); opacity: 0; }
  }

  .cell.empty {
    background: transparent !important; border-color: transparent !important;
    cursor: default; pointer-events: none; box-shadow: none !important;
  }

  /* ===== 连接线 Canvas ===== */
  #line-canvas {
    position: absolute; top: 0; left: 0;
    pointer-events: none; z-index: 10;
  }

  /* ===== 按钮 ===== */
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .btn {
    padding: 8px 18px; border-radius: 99px; border: none;
    cursor: pointer; font-size: 0.82rem; font-weight: 700;
    letter-spacing: 1px; transition: all 0.2s; font-family: inherit;
  }
  .btn-primary {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #000; box-shadow: 0 4px 16px rgba(247,151,30,0.4);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(247,151,30,0.5); }
  .btn-ghost {
    background: var(--card-bg); color: var(--text);
    border: 1px solid var(--card-border); backdrop-filter: blur(8px);
  }
  .btn-ghost:hover { border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.12); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .hint-count {
    background: rgba(168,237,234,0.2); border-radius: 99px;
    padding: 1px 6px; font-size: 0.65rem; margin-left: 3px;
  }

  /* 音乐按钮 */
  .music-btn {
    position: fixed; top: 16px; right: 16px; z-index: 200;
    width: 40px; height: 40px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08); backdrop-filter: blur(10px);
    color: var(--text); font-size: 1.1rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.25s; outline: none;
  }
  .music-btn:hover {
    border-color: var(--accent); background: rgba(247,151,30,0.15);
    box-shadow: 0 0 16px rgba(247,151,30,0.3);
  }
  .music-btn.muted { opacity: 0.5; border-color: rgba(255,255,255,0.1); }

  /* ===== 覆盖层 ===== */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.75); z-index: 100;
    align-items: center; justify-content: center;
    backdrop-filter: blur(6px);
  }
  .overlay.show { display: flex; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: linear-gradient(135deg, rgba(48,43,99,0.97), rgba(36,36,62,0.97));
    border: 1px solid var(--card-border); border-radius: 24px;
    padding: 32px 36px; text-align: center;
    max-width: 380px; width: 90%; box-shadow: var(--shadow);
    animation: modalIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes modalIn {
    from { transform: scale(0.7) translateY(30px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }
  .modal-icon { font-size: 3.5rem; margin-bottom: 8px; }
  .modal-title { font-size: 1.5rem; font-weight: 900; margin-bottom: 5px; }
  .modal-desc { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 18px; line-height: 1.6; }
  .modal-stats { display: flex; gap: 14px; justify-content: center; margin-bottom: 22px; flex-wrap: wrap; }
  .modal-stat { text-align: center; }
  .modal-stat-val { font-size: 1.3rem; font-weight: 700; color: var(--accent2); }
  .modal-stat-lbl { font-size: 0.65rem; color: var(--text-dim); }

  /* ===== 粒子 ===== */
  .particle {
    position: fixed; pointer-events: none; z-index: 50;
    border-radius: 50%;
    animation: particleFly var(--dur, 0.8s) ease-out forwards;
  }
  @keyframes particleFly {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
  }

  .float-score {
    position: fixed; pointer-events: none; z-index: 60;
    font-size: 1.3rem; font-weight: 900;
    color: var(--accent2); text-shadow: 0 0 14px rgba(255,210,0,0.9), 0 2px 4px rgba(0,0,0,0.4);
    animation: floatUp 1s ease-out forwards;
    white-space: nowrap;
  }
  .float-score.big {
    font-size: 1.6rem;
    color: #fff;
    text-shadow: 0 0 20px rgba(247,151,30,1), 0 0 40px rgba(255,210,0,0.8);
  }
  @keyframes floatUp {
    0% { transform: translateY(0) scale(0.7); opacity: 1; }
    30% { transform: translateY(-15px) scale(1.1); opacity: 1; }
    100% { transform: translateY(-65px) scale(0.8); opacity: 0; }
  }

  .combo-toast {
    position: fixed; top: 28%; left: 50%;
    transform: translateX(-50%); z-index: 70;
    font-size: 1.8rem; font-weight: 900;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; pointer-events: none; white-space: nowrap;
    animation: comboAnim 1.2s ease-out forwards;
  }
  @keyframes comboAnim {
    0% { opacity: 0; transform: translateX(-50%) scale(0.5); }
    20% { opacity: 1; transform: translateX(-50%) scale(1.15); }
    70% { opacity: 1; transform: translateX(-50%) scale(1); }
    100% { opacity: 0; transform: translateX(-50%) scale(0.8) translateY(-20px); }
  }

  @media (max-width: 600px) {
    .modal { padding: 22px 18px; }
    .hud-item { padding: 5px 10px; min-width: 60px; }
    .hud-value { font-size: 0.95rem; }
  }

  /* ===== 排行榜弹窗 ===== */
  .leaderboard-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.8); z-index: 200;
    align-items: center; justify-content: center;
    backdrop-filter: blur(8px);
  }
  .leaderboard-overlay.show { display: flex; animation: fadeIn 0.3s ease; }
  .leaderboard-panel {
    background: linear-gradient(135deg, rgba(48,43,99,0.98), rgba(36,36,62,0.98));
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px; padding: 28px 24px; width: 90%; max-width: 480px;
    max-height: 80vh; overflow-y: auto; position: relative;
  }
  .leaderboard-panel::-webkit-scrollbar { width: 4px; }
  .leaderboard-panel::-webkit-scrollbar-thumb { background: rgba(247,151,30,0.4); border-radius: 99px; }
  .lb-title {
    font-size: 1.3rem; font-weight: 900; text-align: center; margin-bottom: 16px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .lb-tabs {
    display: flex; gap: 6px; margin-bottom: 14px; justify-content: center; flex-wrap: wrap;
  }
  .lb-tab {
    padding: 5px 14px; border-radius: 99px; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06); color: var(--text-dim);
    font-size: 0.75rem; cursor: pointer; transition: all 0.2s; font-family: inherit;
  }
  .lb-tab.active, .lb-tab:hover {
    border-color: var(--accent); background: rgba(247,151,30,0.15); color: var(--accent2);
  }
  .lb-list { list-style: none; }
  .lb-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-radius: 10px; margin-bottom: 4px;
    transition: background 0.15s;
  }
  .lb-item:hover { background: rgba(255,255,255,0.06); }
  .lb-rank {
    font-size: 1.1rem; font-weight: 900; width: 32px; text-align: center; flex-shrink: 0;
  }
  .lb-rank.top1 { color: #ffd200; text-shadow: 0 0 10px rgba(255,210,0,0.6); }
  .lb-rank.top2 { color: #c0c0c0; }
  .lb-rank.top3 { color: #cd7f32; }
  .lb-name { flex: 1; font-size: 0.85rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-score-val { font-size: 0.85rem; font-weight: 700; color: var(--accent2); }
  .lb-stars { font-size: 0.75rem; }
  .lb-loading { text-align: center; color: var(--text-dim); padding: 20px; font-size: 0.85rem; }
  .lb-empty { text-align: center; color: var(--text-dim); padding: 20px; font-size: 0.85rem; }
  .lb-close {
    position: absolute; top: 12px; right: 16px;
    background: none; border: none; color: var(--text-dim); font-size: 1.4rem;
    cursor: pointer; transition: color 0.15s; line-height: 1;
  }
  .lb-close:hover { color: var(--red); }

  /* 昵称输入弹窗 */
  .nick-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.75); z-index: 200;
    align-items: center; justify-content: center;
    backdrop-filter: blur(6px);
  }
  .nick-overlay.show { display: flex; animation: fadeIn 0.3s ease; }
  .nick-panel {
    background: linear-gradient(135deg, rgba(48,43,99,0.98), rgba(36,36,62,0.98));
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px; padding: 28px 24px; width: 90%; max-width: 360px;
    text-align: center;
  }
  .nick-title {
    font-size: 1.1rem; font-weight: 800; margin-bottom: 6px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .nick-desc { color: var(--text-dim); font-size: 0.8rem; margin-bottom: 14px; }
  .nick-input {
    width: 100%; padding: 10px 14px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08);
    color: var(--text); font-size: 0.95rem; text-align: center;
    outline: none; font-family: inherit; transition: border-color 0.2s;
    margin-bottom: 14px;
  }
  .nick-input:focus { border-color: var(--accent); }
  .nick-input::placeholder { color: rgba(255,255,255,0.3); }
  .nick-btn-row { display: flex; gap: 8px; justify-content: center; }
  .nick-err { color: var(--red); font-size: 0.75rem; margin-top: 6px; min-height: 18px; }
</style>
</head>
<body>
<canvas id="particles-canvas"></canvas>

<button class="music-btn" id="music-btn" title="背景音乐">🎵</button>
<button class="music-btn" id="btn-leaderboard" title="排行榜" style="top:64px;font-size:1.2rem;">🏆</button>

<div id="app">
  <div id="screen-start" class="screen active">
    <h1 class="game-title">✨ 连连看</h1>
    <p class="start-subtitle">经典消除益智小游戏</p>

    <div class="level-map-wrap">
      <div id="level-map"></div>
    </div>
  </div>

  <div id="screen-game" class="screen">
    <h1 class="game-title" style="font-size:1.3rem;margin-bottom:1px;">✨ 连连看</h1>
    <div class="hud">
      <div class="level-badge-hud">
        <span class="hud-label">关卡</span>
        <span class="hud-value" id="hud-level">—</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">得分</span>
        <span class="hud-value" id="hud-score">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">剩余</span>
        <span class="hud-value" id="hud-pairs">—</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">时间</span>
        <span class="hud-value" id="hud-time">—</span>
      </div>
    </div>
    <div class="time-bar-wrap">
      <div class="time-bar safe" id="time-bar" style="width:100%">
        <div class="time-bar-shine"></div>
        <span class="time-bar-text" id="time-bar-text">03:00</span>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar" id="progress-bar" style="width:0%"></div>
    </div>
    <div id="board-wrap">
      <div id="board"></div>
      <canvas id="line-canvas"></canvas>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-hint">💡 提示 <span class="hint-count" id="hint-count">3</span></button>
      <button class="btn btn-ghost" id="btn-shuffle">🔀 重排</button>
      <button class="btn btn-ghost" id="btn-back">🏠 返回</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay-win">
  <div class="modal">
    <div class="modal-icon">🎉</div>
    <div class="modal-title" style="color:var(--accent2)">关卡完成！</div>
    <div class="modal-desc" id="win-desc"></div>
    <div class="modal-stats">
      <div class="modal-stat"><div class="modal-stat-val" id="win-score">0</div><div class="modal-stat-lbl">得分</div></div>
      <div class="modal-stat"><div class="modal-stat-val" id="win-time">0s</div><div class="modal-stat-lbl">剩余时间</div></div>
      <div class="modal-stat"><div class="modal-stat-val" id="win-stars">⭐</div><div class="modal-stat-lbl">评级</div></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-next-level">下一关 →</button>
      <button class="btn btn-ghost" id="btn-win-menu">关卡选择</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay-lose">
  <div class="modal">
    <div class="modal-icon">😅</div>
    <div class="modal-title" style="color:var(--red)">时间到了！</div>
    <div class="modal-desc">别灰心，再试一次！</div>
    <div class="modal-stats">
      <div class="modal-stat"><div class="modal-stat-val" id="lose-score">0</div><div class="modal-stat-lbl">得分</div></div>
      <div class="modal-stat"><div class="modal-stat-val" id="lose-pairs">0</div><div class="modal-stat-lbl">剩余对数</div></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-retry">🔄 再来一局</button>
      <button class="btn btn-ghost" id="btn-lose-menu">关卡选择</button>
    </div>
  </div>
</div>

// ==================== 工具 ====================
function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function shuffleArr(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = rand(0, i);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ==================== 棋盘数据 ====================
class Board {
  constructor(rows, cols) {
    this.rows = rows; this.cols = cols;
    this.data = Array.from({ length: rows + 2 }, () => new Array(cols + 2).fill(0));
  }
  get(r, c) {
    if (r < 0 || r > this.rows + 1 || c < 0 || c > this.cols + 1) return -1;
    return this.data[r][c];
  }
  set(r, c, v) { this.data[r][c] = v; }
  clear(r, c) { this.data[r][c] = 0; }
  isEmpty(r, c) { return this.data[r][c] === 0; }
  allCells() {
    const cells = [];
    for (let r = 1; r <= this.rows; r++)
      for (let c = 1; c <= this.cols; c++)
        cells.push([r, c]);
    return cells;
  }
}

// ==================== 路径查找 ====================
function isSegmentClear(board, r1, c1, r2, c2) {
  if (r1 === r2) {
    const minC = Math.min(c1, c2), maxC = Math.max(c1, c2);
    for (let c = minC + 1; c < maxC; c++) { if (board.get(r1, c) !== 0) return false; }
    return true;
  }
  if (c1 === c2) {
    const minR = Math.min(r1, r2), maxR = Math.max(r1, r2);
    for (let r = minR + 1; r < maxR; r++) { if (board.get(r, c1) !== 0) return false; }
    return true;
  }
  return false;
}

function findPath(board, r1, c1, r2, c2) {
  if (r1 === r2 && c1 === c2) return null;
  if (board.get(r1, c1) !== board.get(r2, c2) || board.isEmpty(r1, c1) || board.isEmpty(r2, c2)) return null;
  // 0折
  if ((r1 === r2 || c1 === c2) && isSegmentClear(board, r1, c1, r2, c2))
    return [[r1, c1], [r2, c2]];
  // 1折
  if (board.isEmpty(r1, c2) && isSegmentClear(board, r1, c1, r1, c2) && isSegmentClear(board, r1, c2, r2, c2))
    return [[r1, c1], [r1, c2], [r2, c2]];
  if (board.isEmpty(r2, c1) && isSegmentClear(board, r1, c1, r2, c1) && isSegmentClear(board, r2, c1, r2, c2))
    return [[r1, c1], [r2, c1], [r2, c2]];
  // 2折 - 扫描列
  for (let c = 0; c <= board.cols + 1; c++) {
    if (((c === c1) || board.isEmpty(r1, c)) && ((c === c2) || board.isEmpty(r2, c)) &&
        isSegmentClear(board, r1, c1, r1, c) && isSegmentClear(board, r1, c, r2, c) && isSegmentClear(board, r2, c, r2, c2)) {
      const path = [[r1, c1]];
      if (c !== c1) path.push([r1, c]);
      if (c !== c2) path.push([r2, c]);
      path.push([r2, c2]);
      return path;
    }
  }
  // 2折 - 扫描行
  for (let r = 0; r <= board.rows + 1; r++) {
    if (((r === r1) || board.isEmpty(r, c1)) && ((r === r2) || board.isEmpty(r, c2)) &&
        isSegmentClear(board, r1, c1, r, c1) && isSegmentClear(board, r, c1, r, c2) && isSegmentClear(board, r, c2, r2, c2)) {
      const path = [[r1, c1]];
      if (r !== r1) path.push([r, c1]);
      if (r !== r2) path.push([r, c2]);
      path.push([r2, c2]);
      return path;
    }
  }
  return null;
}

// ==================== 死局检测 & 提示 ====================
function findHintPair(board) {
  const cells = board.allCells().filter(([r, c]) => !board.isEmpty(r, c));
  const groups = {};
  cells.forEach(([r, c]) => { const t = board.get(r, c); if (!groups[t]) groups[t] = []; groups[t].push([r, c]); });
  for (const t in groups) {
    const g = groups[t];
    for (let i = 0; i < g.length; i++)
      for (let j = i + 1; j < g.length; j++) {
        const path = findPath(board, g[i][0], g[i][1], g[j][0], g[j][1]);
        if (path) return { cells: [g[i], g[j]], path };
      }
  }
  return null;
}

// ==================== 生成棋盘 ====================
function generateBoard(level) {
  const { rows, cols, tileTypes } = level;
  const total = rows * cols;
  const poolSize = Math.min(tileTypes, TILE_DATA_URLS.length);
  const pool = Array.from({ length: poolSize }, (_, i) => i + 1); // 1-indexed tile IDs
  const pairsNeeded = total / 2;
  let arr = [];
  const base = Math.floor(pairsNeeded / pool.length);
  const extra = pairsNeeded % pool.length;
  pool.forEach((t, i) => { const cnt = base + (i < extra ? 1 : 0); for (let k = 0; k < cnt; k++) { arr.push(t); arr.push(t); } });
  while (arr.length < total) { const t = pool[arr.length % pool.length]; arr.push(t, t); }
  arr = arr.slice(0, total);
  arr = shuffleArr(arr);
  const board = new Board(rows, cols);
  let idx = 0;
  for (let r = 1; r <= rows; r++)
    for (let c = 1; c <= cols; c++)
      board.set(r, c, arr[idx++]);
  return board;
}

// ==================== 游戏主体 ====================
const Game = (() => {
  let board, level, selected, score, hintLeft, timeLeft, timerInterval;
  let totalPairs, matchedPairs, combo, lastMatchTime, hintCells;
  let isAnimating = false;
  let lineAnimFrame = null; // 连接线动画帧

  function init(lvData) {
    level = lvData;
    board = generateBoard(lvData);
    let attempts = 0;
    while (!findHintPair(board) && attempts++ < 20) board = generateBoard(lvData);

    selected = null; score = 0; hintLeft = lvData.hintCount;
    timeLeft = lvData.timeLimit; combo = 0; lastMatchTime = 0;
    hintCells = []; isAnimating = false;
    totalPairs = (lvData.rows * lvData.cols) / 2; matchedPairs = 0;

    showScreen('game');
    renderHUD();
    renderBoard();
    startTimer();
  }

  let prevScore = 0; // 用于分数动画

  function renderHUD() {
    document.getElementById('hud-level').textContent = `${level.icon} ${level.name}`;

    // 分数动画
    const scoreEl = document.getElementById('hud-score');
    if (score !== prevScore) {
      scoreEl.textContent = score;
      scoreEl.classList.add('score-pop');
      setTimeout(() => scoreEl.classList.remove('score-pop'), 200);
      prevScore = score;
    }

    document.getElementById('hud-pairs').textContent = `${totalPairs - matchedPairs}`;
    document.getElementById('hud-time').textContent = formatTime(timeLeft);
    document.getElementById('hint-count').textContent = hintLeft;
    document.getElementById('progress-bar').style.width = (matchedPairs / totalPairs * 100) + '%';

    // 时间进度条
    const ratio = timeLeft / level.timeLimit;
    const bar = document.getElementById('time-bar');
    bar.style.width = (ratio * 100) + '%';
    bar.className = 'time-bar ' + (ratio > 0.35 ? 'safe' : ratio > 0.15 ? 'warn' : 'danger');
    document.getElementById('time-bar-text').textContent = formatTime(timeLeft);
  }

  function formatTime(s) { return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; }

  // ---- 棋盘渲染 ----
  function renderBoard() {
    const boardEl = document.getElementById('board');
    boardEl.innerHTML = '';
    boardEl.style.gridTemplateColumns = `repeat(${level.cols}, 1fr)`;

    for (let r = 1; r <= level.rows; r++) {
      for (let c = 1; c <= level.cols; c++) {
        const val = board.get(r, c);
        const cell = document.createElement('div');
        cell.className = 'cell' + (val === 0 ? ' empty' : '');
        cell.dataset.r = r;
        cell.dataset.c = c;
        if (val !== 0) {
          const img = document.createElement('img');
          img.className = 'tile-icon';
          img.src = TILE_DATA_URLS[val - 1] || '';
          img.alt = '';
          img.draggable = false;
          cell.appendChild(img);
          cell.addEventListener('click', () => onCellClick(r, c));
        }
        boardEl.appendChild(cell);
      }
    }
    // 延迟一帧确保 DOM 布局完成后再计算尺寸
    requestAnimationFrame(() => {
      adaptCellSize();
      resizeLineCanvas();
    });
  }

  function adaptCellSize() {
    const wrap = document.getElementById('board-wrap');
    const boardEl = document.getElementById('board');
    // 用 board-wrap 的可用宽度计算，但确保 DOM 已经渲染
    const wrapW = wrap.clientWidth - 20;
    const maxCellW = Math.floor(wrapW / level.cols) - 3;
    // 根据关卡大小动态调整：小棋盘可以更大，大棋盘需要更小
    const maxForLevel = level.cols <= 8 ? 72 : level.cols <= 12 ? 60 : level.cols <= 14 ? 52 : 44;
    const size = Math.min(maxForLevel, Math.max(28, maxCellW));
    document.querySelectorAll('.cell').forEach(c => {
      c.style.width = size + 'px';
      c.style.height = size + 'px';
    });
    // 同步 canvas 尺寸
    const canvas = document.getElementById('line-canvas');
    canvas.width = wrap.scrollWidth;
    canvas.height = wrap.scrollHeight;
    canvas.style.width = wrap.scrollWidth + 'px';
    canvas.style.height = wrap.scrollHeight + 'px';
  }

  function resizeLineCanvas() {
    const wrap = document.getElementById('board-wrap');
    const canvas = document.getElementById('line-canvas');
    canvas.width = wrap.scrollWidth;
    canvas.height = wrap.scrollHeight;
    canvas.style.width = wrap.scrollWidth + 'px';
    canvas.style.height = wrap.scrollHeight + 'px';
  }

  function getCellEl(r, c) { return document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`); }

  // 获取格子中心坐标（相对于 board-wrap）
  function getCellCenter(r, c) {
    const wrapRect = document.getElementById('board-wrap').getBoundingClientRect();
    // 边界外点需要推算
    if (r >= 1 && r <= level.rows && c >= 1 && c <= level.cols) {
      const el = getCellEl(r, c);
      if (el) {
        const rect = el.getBoundingClientRect();
        return { x: rect.left - wrapRect.left + rect.width / 2, y: rect.top - wrapRect.top + rect.height / 2 };
      }
    }
    // 边界外推算
    const firstEl = getCellEl(1, 1);
    if (!firstEl) return null;
    const fRect = firstEl.getBoundingClientRect();
    const cellW = fRect.width, cellH = fRect.height, gap = 3;
    const nr = Math.max(1, Math.min(level.rows, r));
    const nc = Math.max(1, Math.min(level.cols, c));
    const nearEl = getCellEl(nr, nc);
    if (!nearEl) return null;
    const nRect = nearEl.getBoundingClientRect();
    let x = nRect.left - wrapRect.left + nRect.width / 2;
    let y = nRect.top - wrapRect.top + nRect.height / 2;
    if (r === 0) y -= (cellH + gap);
    else if (r === level.rows + 1) y += (cellH + gap);
    if (c === 0) x -= (cellW + gap);
    else if (c === level.cols + 1) x += (cellW + gap);
    return { x, y };
  }

  // ---- 格子点击 ----
  function onCellClick(r, c) {
    if (board.isEmpty(r, c)) return;
    clearHintHighlight();

    // 动画期间：允许切换选中，但不触发消除动画
    if (isAnimating) {
      if (selected) {
        getCellEl(selected[0], selected[1])?.classList.remove('selected');
      }
      selected = [r, c];
      getCellEl(r, c)?.classList.add('selected');
      return;
    }

    if (!selected) {
      selected = [r, c];
      getCellEl(r, c).classList.add('selected');
      return;
    }

    const [sr, sc] = selected;
    if (sr === r && sc === c) { getCellEl(r, c).classList.remove('selected'); selected = null; return; }

    if (board.get(sr, sc) !== board.get(r, c)) {
      getCellEl(sr, sc).classList.remove('selected');
      getCellEl(r, c).classList.add('wrong');
      setTimeout(() => getCellEl(r, c)?.classList.remove('wrong'), 400);
      selected = [r, c]; getCellEl(r, c).classList.add('selected');
      penalizeWrong();
      return;
    }

    const path = findPath(board, sr, sc, r, c);
    if (!path) {
      getCellEl(sr, sc).classList.remove('selected');
      [getCellEl(sr, sc), getCellEl(r, c)].forEach(el => { el?.classList.add('wrong'); setTimeout(() => el?.classList.remove('wrong'), 400); });
      selected = [r, c]; getCellEl(r, c).classList.add('selected');
      penalizeWrong();
      return;
    }

    // 匹配成功！
    isAnimating = true;
    getCellEl(sr, sc).classList.remove('selected');
    getCellEl(r, c).classList.add('selected');
    selected = null;
    animateConnectionLine(path, () => {
      removePair(sr, sc, r, c);
    });
  }

  // ---- 连接线动画（Canvas 实现） ----
  function animateConnectionLine(path, onDone) {
    const canvas = document.getElementById('line-canvas');
    const ctx = canvas.getContext('2d');
    resizeLineCanvas();

    const points = path.map(([r, c]) => getCellCenter(r, c)).filter(Boolean);
    if (points.length < 2) { onDone(); return; }

    // 计算路径总长度
    let totalLen = 0;
    const segLens = [];
    for (let i = 1; i < points.length; i++) {
      const dx = points[i].x - points[i-1].x, dy = points[i].y - points[i-1].y;
      const len = Math.sqrt(dx * dx + dy * dy);
      segLens.push(len);
      totalLen += len;
    }

    const drawDuration = 170; // ms 画线时间（原250，加速1/3）
    const holdDuration = 130; // ms 停留时间（原200，加速1/3）
    const fadeDuration = 130; // ms 消退时间（原200，加速1/3）
    const startTime = performance.now();

    if (lineAnimFrame) cancelAnimationFrame(lineAnimFrame);

    // 渐变色定义
    const gradientColors = [
      { offset: 0, color: '#ffd200' },
      { offset: 0.5, color: '#f7971e' },
      { offset: 1, color: '#ff6b6b' }
    ];

    function draw(now) {
      const elapsed = now - startTime;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      let progress, alpha;
      if (elapsed < drawDuration) {
        progress = elapsed / drawDuration;
        alpha = 1;
      } else if (elapsed < drawDuration + holdDuration) {
        progress = 1;
        alpha = 1;
      } else if (elapsed < drawDuration + holdDuration + fadeDuration) {
        progress = 1;
        alpha = 1 - (elapsed - drawDuration - holdDuration) / fadeDuration;
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        lineAnimFrame = null;
        onDone();
        return;
      }

      // 计算当前应画到哪个位置
      const drawLen = progress * totalLen;
      let accumulated = 0;
      const drawPoints = [points[0]];

      for (let i = 0; i < segLens.length; i++) {
        if (accumulated + segLens[i] <= drawLen) {
          drawPoints.push(points[i + 1]);
          accumulated += segLens[i];
        } else {
          const remain = drawLen - accumulated;
          const ratio = remain / segLens[i];
          const x = points[i].x + (points[i+1].x - points[i].x) * ratio;
          const y = points[i].y + (points[i+1].y - points[i].y) * ratio;
          drawPoints.push({ x, y });
          break;
        }
      }

      // 逐段绘制渐变连线
      for (let i = 1; i < drawPoints.length; i++) {
        const segRatio = i / (drawPoints.length - 1 || 1);

        // 发光外层
        ctx.save();
        ctx.globalAlpha = alpha * 0.25;
        ctx.strokeStyle = segRatio < 0.5 ? '#ffd200' : '#f7971e';
        ctx.lineWidth = 14;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.shadowColor = segRatio < 0.5 ? '#ffd200' : '#f7971e';
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.moveTo(drawPoints[i-1].x, drawPoints[i-1].y);
        ctx.lineTo(drawPoints[i].x, drawPoints[i].y);
        ctx.stroke();
        ctx.restore();

        // 中层渐变
        ctx.save();
        ctx.globalAlpha = alpha * 0.6;
        const midGrad = ctx.createLinearGradient(
          drawPoints[i-1].x, drawPoints[i-1].y,
          drawPoints[i].x, drawPoints[i].y
        );
        midGrad.addColorStop(0, '#ffd200');
        midGrad.addColorStop(0.5, '#f7971e');
        midGrad.addColorStop(1, '#ff6b6b');
        ctx.strokeStyle = midGrad;
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(drawPoints[i-1].x, drawPoints[i-1].y);
        ctx.lineTo(drawPoints[i].x, drawPoints[i].y);
        ctx.stroke();
        ctx.restore();
      }

      // 白色亮芯线（整体）
      ctx.save();
      ctx.globalAlpha = alpha * 0.9;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.shadowColor = '#fff';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(drawPoints[0].x, drawPoints[0].y);
      for (let i = 1; i < drawPoints.length; i++) ctx.lineTo(drawPoints[i].x, drawPoints[i].y);
      ctx.stroke();
      ctx.restore();

      // 动态流动光点（沿路径移动）
      if (drawPoints.length >= 2 && progress < 1) {
        const totalDrawn = 0;
        let flowAcc = 0;
        for (let i = 1; i < drawPoints.length; i++) {
          const dx = drawPoints[i].x - drawPoints[i-1].x;
          const dy = drawPoints[i].y - drawPoints[i-1].y;
          flowAcc += Math.sqrt(dx * dx + dy * dy);
        }
        // 光点在路径末端
        const last = drawPoints[drawPoints.length - 1];
        const prev = drawPoints[drawPoints.length - 2];
        if (last && prev) {
          ctx.save();
          ctx.globalAlpha = alpha;
          const grad = ctx.createRadialGradient(last.x, last.y, 0, last.x, last.y, 8);
          grad.addColorStop(0, '#fff');
          grad.addColorStop(0.3, '#ffd200');
          grad.addColorStop(1, 'rgba(247,151,30,0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(last.x, last.y, 8, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      // 端点光圈（起点和终点）
      [drawPoints[0], drawPoints[drawPoints.length - 1]].forEach((p, idx) => {
        ctx.save();
        ctx.globalAlpha = alpha * 0.7;
        const glowColor = idx === 0 ? '#ffd200' : '#f7971e';
        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 12);
        grad.addColorStop(0, '#fff');
        grad.addColorStop(0.4, glowColor);
        grad.addColorStop(1, 'rgba(79,195,247,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      lineAnimFrame = requestAnimationFrame(draw);
    }

    lineAnimFrame = requestAnimationFrame(draw);
  }

  // ---- 消除一对 ----
  function removePair(r1, c1, r2, c2) {
    const el1 = getCellEl(r1, c1), el2 = getCellEl(r2, c2);
    spawnParticles(el1); spawnParticles(el2);
    el1?.classList.add('matched'); el2?.classList.add('matched');

    setTimeout(() => {
      board.clear(r1, c1); board.clear(r2, c2);
      [el1, el2].forEach(el => { if (el) { el.innerHTML = ''; el.className = 'cell empty'; } });

      matchedPairs++;
      const now = Date.now();
      combo = (now - lastMatchTime < 3000) ? combo + 1 : 1;
      lastMatchTime = now;
      const comboBonus = combo > 1 ? combo * 15 : 0;
      const pts = 50 + comboBonus + Math.floor(timeLeft / 10);
      score += pts;

      // 连击时间加成：连续消除奖励时间
      let timeBonus = 0;
      if (combo >= 10) timeBonus = 8;
      else if (combo >= 7) timeBonus = 5;
      else if (combo >= 4) timeBonus = 3;
      else if (combo >= 2) timeBonus = 2;
      if (timeBonus > 0) {
        timeLeft += timeBonus;
        // 时间条闪烁效果
        const bar = document.getElementById('time-bar');
        bar.classList.add('bonus');
        setTimeout(() => bar.classList.remove('bonus'), 600);
      }

      showFloatScore(el1, `+${pts}${combo > 1 ? ` x${combo}` : ''}${timeBonus > 0 ? ` ⏱+${timeBonus}s` : ''}`);
      if (combo >= 3) showComboToast(`${combo} COMBO! 🔥${timeBonus > 0 ? ` ⏱+${timeBonus}s` : ''}`);

      renderHUD(); isAnimating = false;

      if (matchedPairs >= totalPairs) { setTimeout(onWin, 300); return; }
      if (!findHintPair(board)) { setTimeout(() => { doShuffleBoard(); showComboToast('自动重排！✨'); }, 200); }
    }, 280);
  }

  // ---- 错误惩罚 ----
  function penalizeWrong() {
    // 重置连击
    combo = 0;
    // 扣除时间
    const penalty = Math.min(5, Math.max(2, Math.floor(timeLeft * 0.02)));
    timeLeft = Math.max(0, timeLeft - penalty);
    // 时间条闪烁
    const bar = document.getElementById('time-bar');
    bar.classList.add('penalty');
    setTimeout(() => bar.classList.remove('penalty'), 500);
    showFloatScore(document.querySelector('.cell.wrong'), `-${penalty}s ⏱️`);
    renderHUD();
    if (timeLeft <= 0) { stopTimer(); onLose(); }
  }

  // ---- 提示 ----
  function hint() {
    if (hintLeft <= 0 || isAnimating) return;
    clearHintHighlight();
    const pair = findHintPair(board);
    if (!pair) { doShuffleBoard(); return; }
    hintLeft--;
    hintCells = pair.cells;
    hintCells.forEach(([r, c]) => getCellEl(r, c)?.classList.add('hint'));
    renderHUD();
    setTimeout(clearHintHighlight, 2500);
  }

  function clearHintHighlight() { hintCells.forEach(([r, c]) => getCellEl(r, c)?.classList.remove('hint')); hintCells = []; }

  // ---- 重排 ----
  function doShuffle() {
    if (isAnimating) return;
    clearHintHighlight();
    if (selected) { getCellEl(selected[0], selected[1])?.classList.remove('selected'); selected = null; }
    doShuffleBoard();
  }

  function doShuffleBoard() {
    const cells = board.allCells().filter(([r, c]) => !board.isEmpty(r, c));
    if (cells.length === 0) return;
    const vals = cells.map(([r, c]) => board.get(r, c));
    let tries = 0;
    do { const sv = shuffleArr(vals); cells.forEach(([r, c], i) => board.set(r, c, sv[i])); tries++; } while (!findHintPair(board) && tries < 50);
    selected = null;
    renderBoard();
    resizeLineCanvas();
  }

  // ---- 计时器 ----
  function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => { timeLeft--; renderHUD(); if (timeLeft <= 0) { clearInterval(timerInterval); onLose(); } }, 1000);
  }
  function stopTimer() { clearInterval(timerInterval); }

  // ---- 胜利 ----
  function onWin() {
    stopTimer();
    const ratio = timeLeft / level.timeLimit;
    const stars = ratio > 0.5 ? '⭐⭐⭐' : ratio > 0.25 ? '⭐⭐' : '⭐';
    const progress = JSON.parse(localStorage.getItem('llk-progress') || '{}');
    const prev = progress[level.id] || { stars: 0, score: 0 };
    const starNum = stars.split('⭐').length - 1;
    if (score > prev.score || starNum > prev.stars)
      progress[level.id] = { stars: Math.max(starNum, prev.stars), score: Math.max(score, prev.score) };
    localStorage.setItem('llk-progress', JSON.stringify(progress));

    // 先显示胜利动画，然后弹出昵称输入
    document.getElementById('win-score').textContent = score;
    document.getElementById('win-time').textContent = formatTime(timeLeft);
    document.getElementById('win-stars').textContent = stars;
    document.getElementById('win-desc').textContent = `${level.name}通关！${combo > 2 ? `最高${combo}连击！` : ''}`;

    const nextLvl = LEVELS.find(l => l.id === level.id + 1);
    const btnNext = document.getElementById('btn-next-level');
    btnNext.style.display = nextLvl ? '' : 'none';
    btnNext.onclick = () => { closeOverlays(); init(nextLvl); };
    launchConfetti();
    document.getElementById('overlay-win').classList.add('show');

    // 2秒后自动弹出昵称输入（也可手动点"提交分数"）
    setTimeout(() => {
      if (window.showNickDialog) window.showNickDialog(level.id, level.name, score, starNum, timeLeft);
    }, 2000);
  }

  function onLose() {
    stopTimer();
    document.getElementById('lose-score').textContent = score;
    document.getElementById('lose-pairs').textContent = totalPairs - matchedPairs;
    document.getElementById('btn-retry').onclick = () => { closeOverlays(); init(level); };
    document.getElementById('overlay-lose').classList.add('show');
  }

  function closeOverlays() { document.querySelectorAll('.overlay').forEach(o => o.classList.remove('show')); }
  function backToMenu() { stopTimer(); closeOverlays(); showScreen('start'); renderMenu(); }

  // ---- 特效 ----
  function spawnParticles(el) {
    if (!el) return;
    const rect = el.getBoundingClientRect();
    const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    const colors = ['#f7971e','#ffd200','#4fc3f7','#a8edea','#ff6b6b','#c471ed'];
    for (let i = 0; i < 10; i++) {
      const p = document.createElement('div'); p.className = 'particle';
      const angle = Math.random() * 2 * Math.PI, dist = rand(30, 90), size = rand(4, 12);
      p.style.cssText = `left:${cx-size/2}px;top:${cy-size/2}px;width:${size}px;height:${size}px;background:${colors[rand(0,colors.length-1)]};--tx:${Math.cos(angle)*dist}px;--ty:${Math.sin(angle)*dist}px;--dur:${rand(5,9)/10}s`;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1000);
    }
  }

  function showFloatScore(el, text) {
    if (!el) return;
    const rect = el.getBoundingClientRect();
    const div = document.createElement('div'); div.className = 'float-score';
    // 如果包含时间加成文字，使用更大更醒目的样式
    if (text.includes('⏱')) div.classList.add('big');
    div.textContent = text;
    div.style.left = (rect.left + rect.width / 2 - 40) + 'px';
    div.style.top = (rect.top - 8) + 'px';
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 1000);
  }

  function showComboToast(text) {
    const div = document.createElement('div'); div.className = 'combo-toast';
    div.textContent = text;
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 1200);
  }

  function launchConfetti() {
    const colors = ['#f7971e','#ffd200','#4fc3f7','#ff6b6b','#a8edea','#c471ed','#fff'];
    for (let i = 0; i < 60; i++) {
      setTimeout(() => {
        const p = document.createElement('div'); p.className = 'particle';
        const size = rand(5, 12);
        p.style.cssText = `left:${rand(0,window.innerWidth)}px;top:-10px;width:${size}px;height:${size}px;background:${colors[rand(0,colors.length-1)]};border-radius:${rand(0,50)}%;--tx:${rand(-180,180)}px;--ty:${rand(200,500)}px;--dur:${rand(8,14)/10}s`;
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1500);
      }, i * 25);
    }
  }

  return { init, hint, shuffle: doShuffle, backToMenu };
})();

// ==================== 页面控制 ====================
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  window.scrollTo(0, 0);
}

function renderMenu() {
  const map = document.getElementById('level-map');
  const progress = JSON.parse(localStorage.getItem('llk-progress') || '{}');
  const chapters = [
    { title: '🌱 第一章 · 启程', range: [1,5] },
    { title: '⛰️ 第二章 · 磨练', range: [6,10] },
    { title: '⚔️ 第三章 · 挑战', range: [11,15] },
    { title: '🎭 第四章 · 大师', range: [16,20] },
    { title: '⭐ 第五章 · 传说', range: [21,25] },
    { title: '🐉 第六章 · 极境', range: [26,30] },
  ];

  let html = '';
  chapters.forEach((ch, chIdx) => {
    const lvls = LEVELS.filter(l => l.id >= ch.range[0] && l.id <= ch.range[1]);
    html += `<div class="chapter-block">`;
    html += `<div class="chapter-title">${ch.title}</div>`;
    html += `<div class="map-row">`;

    lvls.forEach((lv, i) => {
      const p = progress[lv.id];
      const starNum = p ? (p.stars || 0) : 0;
      const cleared = starNum > 0;
      const cleared3 = starNum >= 3;

      let nodeClass = 'map-node';
      if (cleared3) nodeClass += ' cleared3';
      else if (cleared) nodeClass += ' cleared';

      const starsHtml = cleared ? `<span class="node-stars">${'★'.repeat(starNum)}${'☆'.repeat(3-starNum)}</span>` : '';
      const badgeHtml = lv.badge ? `<span class="node-badge">${lv.badge}</span>` : '';

      html += `<div class="${nodeClass}" onclick="startLevel(${lv.id})" title="${lv.name} (${lv.rows}×${lv.cols})">`;
      html += starsHtml;
      html += badgeHtml;
      html += `<span class="node-icon">${lv.icon}</span>`;
      html += `<span class="node-num">${lv.id}</span>`;
      html += `</div>`;

      // 节点之间的连线（最后一个不加）
      if (i < lvls.length - 1) {
        html += `<div class="map-path${cleared ? ' cleared-path' : ''}"></div>`;
      }
    });

    html += `</div></div>`;
  });

  map.innerHTML = html;
}

function startLevel(id) { const level = LEVELS.find(l => l.id === id); if (level) Game.init(level); }

// ==================== 事件绑定 ====================
document.addEventListener('DOMContentLoaded', () => {
  renderMenu(); showScreen('start');
  document.getElementById('btn-hint').addEventListener('click', () => Game.hint());
  document.getElementById('btn-shuffle').addEventListener('click', () => Game.shuffle());
  document.getElementById('btn-back').addEventListener('click', () => Game.backToMenu());
  document.getElementById('btn-win-menu').addEventListener('click', () => Game.backToMenu());
  document.getElementById('btn-lose-menu').addEventListener('click', () => Game.backToMenu());

  window.addEventListener('resize', () => {
    if (document.getElementById('screen-game').classList.contains('active')) {
      const boardEl = document.getElementById('board');
      if (boardEl.children.length > 0) {
        const wrap = document.getElementById('board-wrap');
        const wrapW = wrap.clientWidth - 20;
        const cols = level ? level.cols : 8;
        const maxCellW = Math.floor(wrapW / cols) - 3;
        const maxForLevel = cols <= 8 ? 72 : cols <= 12 ? 60 : cols <= 14 ? 52 : 44;
        const size = Math.min(maxForLevel, Math.max(28, maxCellW));
        document.querySelectorAll('.cell').forEach(c => { c.style.width = size + 'px'; c.style.height = size + 'px'; });
        // 调整 canvas 大小
        const canvas = document.getElementById('line-canvas');
        canvas.width = wrap.scrollWidth; canvas.height = wrap.scrollHeight;
        canvas.style.width = wrap.scrollWidth + 'px'; canvas.style.height = wrap.scrollHeight + 'px';
      }
    }
  });
});

// ==================== 粒子背景 ====================
(function() {
  const canvas = document.getElementById('particles-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles;
  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  function create() {
    particles = Array.from({ length: 50 }, () => ({
      x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.5 + 0.5,
      vx: (Math.random() - 0.5) * 0.25, vy: (Math.random() - 0.5) * 0.25,
      alpha: Math.random() * 0.4 + 0.1
    }));
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${p.alpha})`; ctx.fill();
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
    });
    requestAnimationFrame(draw);
  }
  resize(); create(); draw();
  window.addEventListener('resize', resize);
})();

// ==================== 背景音乐 ====================
(function() {
  let audio = null;
  let isPlaying = false;

  // 页面加载时预加载音乐文件
  function loadMusic() {
    audio = new Audio('bgm.mp3');
    audio.loop = true;
    audio.volume = 0.5; // 音量 50%
    audio.preload = 'auto';
  }
  loadMusic();

  function startMusic() {
    if (!audio || isPlaying) return;
    audio.play().then(() => {
      isPlaying = true;
    }).catch(e => {
      // 浏览器阻止自动播放，等用户交互
      console.log('等待用户交互后播放');
    });
  }

  function stopMusic() {
    if (!audio || !isPlaying) return;
    audio.pause();
    isPlaying = false;
  }

  function toggleMusic() {
    const btn = document.getElementById('music-btn');
    if (isPlaying) {
      stopMusic();
      btn.textContent = '🔇';
      btn.classList.add('muted');
    } else {
      startMusic();
      btn.textContent = '🎵';
      btn.classList.remove('muted');
    }
  }

  // 音乐按钮事件
  document.getElementById('music-btn').addEventListener('click', toggleMusic);

  // 首次用户交互时自动开始播放
  let autoStarted = false;
  document.addEventListener('click', function autoStart() {
    if (!autoStarted && !isPlaying) {
      startMusic();
      autoStarted = true;
    }
  }, { once: false });

  // 暴露 API
  window.BGM = { start: startMusic, stop: stopMusic, toggle: toggleMusic, get isPlaying() { return isPlaying; } };
})();

// ==================== 服务器排行榜 API ====================
(function(){
  const API_BASE = location.origin; // 后端同域部署时自动适配
  let currentLbTab = 'total'; // 'total' 或关卡数字

  // ---- 昵称输入弹窗 ----
  function showNickDialog(levelId, levelName, score, stars, timeLeft) {
    let overlay = document.getElementById('nick-overlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'nick-overlay';
      overlay.className = 'nick-overlay';
      overlay.innerHTML = `
        <div class="nick-panel">
          <button class="lb-close" id="nick-close">✕</button>
          <div class="nick-title">🎉 关卡完成！</div>
          <div class="nick-desc">输入昵称提交分数到排行榜</div>
          <input class="nick-input" id="nick-input" maxlength="12" placeholder="请输入昵称（2-12字）" autocomplete="off" />
          <div class="nick-btn-row">
            <button class="btn btn-ghost" id="nick-skip">跳过</button>
            <button class="btn btn-primary" id="nick-submit">提交分数</button>
          </div>
          <div class="nick-err" id="nick-err"></div>
        </div>`;
      document.body.appendChild(overlay);
      document.getElementById('nick-close').onclick = () => overlay.classList.remove('show');
      document.getElementById('nick-skip').onclick = () => overlay.classList.remove('show');
      document.getElementById('nick-submit').onclick = () => doSubmit();
      document.getElementById('nick-input').addEventListener('keydown', e => { if (e.key === 'Enter') doSubmit(); });
    }
    document.getElementById('nick-err').textContent = '';
    document.getElementById('nick-input').value = localStorage.getItem('llk-nick') || '';
    overlay.classList.add('show');
    setTimeout(() => document.getElementById('nick-input').focus(), 100);

    window.__pendingScore = { levelId, levelName, score, stars, timeLeft };

    function doSubmit() {
      const nick = document.getElementById('nick-input').value.trim();
      const errEl = document.getElementById('nick-err');
      if (!nick || nick.length < 2) { errEl.textContent = '请输入至少2个字符的昵称'; return; }
      if (nick.length > 12) { errEl.textContent = '昵称最多12个字符'; return; }
      localStorage.setItem('llk-nick', nick);
      errEl.textContent = '';
      overlay.classList.remove('show');
      submitScore(nick, levelId, levelName, score, stars, timeLeft);
    }
  }

  function submitScore(nickname, levelId, levelName, score, stars, timeLeft) {
    fetch(API_BASE + '/api/score', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nickname, level_id: levelId, level_name: levelName, score, stars, time_left: timeLeft })
    }).then(r => r.json()).then(resp => {
      if (resp.ok) {
        showLeaderboard(levelId);
      } else {
        alert('提交失败，请重试');
      }
    }).catch(() => {
      // 后端不可用时静默失败，不影响游戏
      console.warn('排行榜提交失败，后端可能未启动');
    });
  }

  // ---- 排行榜弹窗 ----
  function showLeaderboard(highlightLevelId) {
    let overlay = document.getElementById('lb-overlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'lb-overlay';
      overlay.className = 'leaderboard-overlay';
      overlay.innerHTML = `
        <div class="leaderboard-panel">
          <button class="lb-close" id="lb-close">✕</button>
          <div class="lb-title">🏆 排行榜</div>
          <div class="lb-tabs" id="lb-tabs">
            <button class="lb-tab active" data-tab="total">总榜</button>
          </div>
          <div id="lb-list-wrap"></div>
        </div>`;
      document.body.appendChild(overlay);
      document.getElementById('lb-close').onclick = () => overlay.classList.remove('show');
      document.getElementById('lb-tabs').addEventListener('click', e => {
        if (e.target.classList.contains('lb-tab')) {
          document.querySelectorAll('.lb-tab').forEach(t => t.classList.remove('active'));
          e.target.classList.add('active');
          currentLbTab = e.target.dataset.tab;
          loadLeaderboard();
        }
      });
    }

    // 动态生成关卡 tab（只生成有数据的）
    const tabsEl = document.getElementById('lb-tabs');
    // 保留"总榜"tab，补充关卡 tabs
    const existingTabs = tabsEl.querySelectorAll('.lb-tab');
    const maxLevel = Math.max(...(window.LEVELS || []).map(l => l.id).concat([0]));
    for (let i = 1; i <= maxLevel; i++) {
      if (!tabsEl.querySelector(`[data-tab="${i}"]`)) {
        const btn = document.createElement('button');
        btn.className = 'lb-tab';
        btn.dataset.tab = String(i);
        btn.textContent = '第' + i + '关';
        tabsEl.appendChild(btn);
      }
    }

    overlay.classList.add('show');
    // 如果指定了关卡，切到对应 tab
    if (highlightLevelId) {
      const tab = tabsEl.querySelector(`[data-tab="${highlightLevelId}"]`);
      if (tab) {
        tabsEl.querySelectorAll('.lb-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentLbTab = String(highlightLevelId);
      }
    }
    loadLeaderboard();
  }

  function loadLeaderboard() {
    const wrap = document.getElementById('lb-list-wrap');
    wrap.innerHTML = '<div class="lb-loading">加载中...</div>';

    const tab = currentLbTab;
    const url = tab === 'total' ? API_BASE + '/api/leaderboard' : API_BASE + '/api/leaderboard?level_id=' + tab;

    fetch(url).then(r => r.json()).then(resp => {
      if (!resp.ok) { wrap.innerHTML = '<div class="lb-empty">暂无数据</div>'; return; }
      const data = resp.data || [];
      if (data.length === 0) { wrap.innerHTML = '<div class="lb-empty">暂无数据，快来抢占榜首！</div>'; return; }

      let html = '<ul class="lb-list">';
      data.forEach((item, idx) => {
        const rankClass = idx < 3 ? ' top' + (idx+1) : '';
        const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : (idx+1);
        let detail = '';
        if (tab === 'total') {
          detail = `<span class="lb-score-val">${item.total_score}分</span><span class="lb-stars">⭐×${item.total_stars}</span>`;
        } else {
          detail = `<span class="lb-score-val">${item.score}分</span><span class="lb-stars">⭐×${item.stars}</span>`;
        }
        html += `<li class="lb-item">
          <span class="lb-rank${rankClass}">${medal}</span>
          <span class="lb-name">${escapeHtml(item.nickname)}</span>
          ${detail}
        </li>`;
      });
      html += '</ul>';
      wrap.innerHTML = html;
    }).catch(() => {
      wrap.innerHTML = '<div class="lb-empty">连接服务器失败，请确认后端已启动</div>';
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // 在胜利后调用（替换原有关闭逻辑）
  window.showNickDialog = showNickDialog;
  window.showLeaderboard = showLeaderboard;

  // 排行榜按钮
  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('btn-leaderboard');
    if (btn) btn.addEventListener('click', () => showLeaderboard());
  });
})();
</script>
